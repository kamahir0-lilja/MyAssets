name: Package verification
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    outputs:
      unity-license: ${{ steps.license.outputs.configured }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/validate.py
      - name: Detect Unity test configuration
        id: license
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          if [ -n "$UNITY_LICENSE" ] || { [ -n "$UNITY_SERIAL" ] && [ -n "$UNITY_EMAIL" ] && [ -n "$UNITY_PASSWORD" ]; }; then
            echo 'configured=true' >> "$GITHUB_OUTPUT"
          else
            echo 'configured=false' >> "$GITHUB_OUTPUT"
            echo 'Unity tests skipped: configure GameCI license secrets. Static validation is not a Unity test pass.' >> "$GITHUB_STEP_SUMMARY"
          fi

  unity:
    needs: static
    if: needs.static.outputs.unity-license == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          unityVersion: 6000.6.6f1
          testMode: EditMode
          coverageEnabled: false
          artifactsPath: artifacts/unity
      - name: Require nonempty passing test reports
        run: python3 scripts/check_results.py artifacts/unity
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unity-editmode-results
          path: artifacts/
